<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- Apply the saved theme before render to avoid a flash (default: light) -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <title>About Us - Value Connect</title>

    <meta
      name="description"
      content="The Value Connect story."
    />

    <!-- Icons -->
    <link
      rel="icon"
      href="https://cdn.pixelcave.com/favicon.svg"
      sizes="any"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="https://cdn.pixelcave.com/favicon.png"
      type="image/png"
    />

    <!-- Inter web font from bunny.net (GDPR compliant) -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Compiled Tailwind CSS (source: src/input.css, build with: npm run build) -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Alpine.js -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <!-- Alpine.js (x-cloak - https://alpinejs.dev/directives/cloak) -->
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body class="antialiased">
    <!-- Page Container -->
    <div
      x-data="{
        darkMode: document.documentElement.classList.contains('dark'),
        toggleDarkMode() {
          this.darkMode = ! this.darkMode;

          // Toggle dark class on <html> and persist the choice
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        }
      }"
      class="min-h-dvh min-w-80 bg-page text-zinc-800 dark:bg-page-dark dark:text-zinc-100"
    >
      <!-- Page Content -->
      <main
        id="page-content"
        class="mx-auto flex max-w-6xl flex-auto flex-col px-4 pb-4 lg:px-8 lg:pb-8"
      >
        <!-- Main Header -->
        <header
          id="page-header"
          class="flex flex-none items-center justify-between py-7"
        >
          <div class="flex items-center gap-2">
            <!-- Logo -->
            <a
              href="index.html"
              class="inline-block transition hover:opacity-80 active:opacity-75"
            >
              <img
                src="assets/value_connect_logo.png"
                alt="Value Connect"
                class="h-14 w-auto"
              />
            </a>
            <!-- END Logo -->

            <!-- Toggle Dark Mode -->
            <button
              x-on:click="toggleDarkMode()"
              type="button"
              class="relative inline-flex size-9 items-center justify-center text-zinc-600 hover:opacity-75 dark:text-zinc-400"
            >
              <div
                x-cloak
                x-show="!darkMode"
                x-transition:enter="transition ease-out duration-150"
                x-transition:enter-start="opacity-0 rotate-180"
                x-transition:enter-end="opacity-100 rotate-0"
                x-transition:leave="transition ease-in duration-100"
                x-transition:leave-start="opacity-100 rotate-0"
                x-transition:leave-end="opacity-0 rotate-180"
                class="absolute inset-0 flex items-center justify-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="hi-outline hi-sun inline-block size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                  />
                </svg>
              </div>
              <div
                x-cloak
                x-show="darkMode"
                x-transition:enter="transition ease-out duration-150"
                x-transition:enter-start="opacity-0 rotate-180"
                x-transition:enter-end="opacity-100 rotate-0"
                x-transition:leave="transition ease-in duration-100"
                x-transition:leave-start="opacity-100 rotate-0"
                x-transition:leave-end="opacity-0 rotate-180"
                class="absolute inset-0 flex items-center justify-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="hi-outline hi-moon inline-block size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                  />
                </svg>
              </div>
            </button>
            <!-- END Toggle Dark Mode -->
          </div>
          <div class="flex items-center gap-4">
            <!-- Nav -->
            <nav class="flex items-center gap-6">
              <a
                href="index.html"
                class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
              >
                Overview
              </a>

              <!-- About Dropdown -->
              <div class="relative" x-data="{ open: false }" x-on:click.outside="open = false">
                <button
                  x-on:click="open = ! open"
                  type="button"
                  class="flex items-center gap-1 text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
                >
                  <span>About</span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="inline-block size-4 transition-transform duration-150"
                    x-bind:class="open ? 'rotate-180' : ''"
                    aria-hidden="true"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div
                  x-cloak
                  x-show="open"
                  x-transition:enter="transition ease-out duration-150"
                  x-transition:enter-start="opacity-0 -translate-y-1"
                  x-transition:enter-end="opacity-100 translate-y-0"
                  x-transition:leave="transition ease-in duration-100"
                  x-transition:leave-start="opacity-100 translate-y-0"
                  x-transition:leave-end="opacity-0 -translate-y-1"
                  class="absolute left-0 z-10 mt-2 w-52 rounded-lg border border-zinc-200 bg-white p-2 shadow-lg dark:border-zinc-800 dark:bg-page-dark"
                >
                  <a
                    href="about.html"
                    class="block rounded-md px-3 py-2 text-sm text-zinc-700 hover:bg-zinc-100 hover:text-black dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white"
                  >
                    Value Connect
                  </a>
                  <a
                    href="meet-our-founder.html"
                    class="block rounded-md px-3 py-2 text-sm text-zinc-700 hover:bg-zinc-100 hover:text-black dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white"
                  >
                    Meet Our Founder
                  </a>
                </div>
              </div>
              <!-- END About Dropdown -->

              <!-- Services Dropdown -->
              <div class="relative" x-data="{ open: false }" x-on:click.outside="open = false">
                <button
                  x-on:click="open = ! open"
                  type="button"
                  class="flex items-center gap-1 text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
                >
                  <span>Services</span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="inline-block size-4 transition-transform duration-150"
                    x-bind:class="open ? 'rotate-180' : ''"
                    aria-hidden="true"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div
                  x-cloak
                  x-show="open"
                  x-transition:enter="transition ease-out duration-150"
                  x-transition:enter-start="opacity-0 -translate-y-1"
                  x-transition:enter-end="opacity-100 translate-y-0"
                  x-transition:leave="transition ease-in duration-100"
                  x-transition:leave-start="opacity-100 translate-y-0"
                  x-transition:leave-end="opacity-0 -translate-y-1"
                  class="absolute right-0 z-10 mt-2 w-52 rounded-lg border border-zinc-200 bg-white p-2 shadow-lg dark:border-zinc-800 dark:bg-page-dark"
                >
                  <a
                    href="index.html#leadership"
                    class="block rounded-md px-3 py-2 text-sm text-zinc-700 hover:bg-zinc-100 hover:text-black dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white"
                  >
                    Leadership
                  </a>
                  <a
                    href="index.html#coaching"
                    class="block rounded-md px-3 py-2 text-sm text-zinc-700 hover:bg-zinc-100 hover:text-black dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white"
                  >
                    Coaching
                  </a>
                  <a
                    href="index.html#discover"
                    class="block rounded-md px-3 py-2 text-sm text-zinc-700 hover:bg-zinc-100 hover:text-black dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white"
                  >
                    Discover
                  </a>
                </div>
              </div>
              <!-- END Services Dropdown -->

              <a
                href="index.html#testimonials"
                class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
              >
                Testimonials
              </a>
              <a
                href="media-highlights.html"
                class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
              >
                Media &amp; Highlights
              </a>
              <a
                href="index.html#contact"
                class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
              >
                Contact Us
              </a>
            </nav>
            <!-- END Nav -->
          </div>
        </header>
        <!-- END Main Header -->

        <!-- About: Our Story -->
        <section class="flex flex-auto flex-col items-center py-16 text-center md:py-24">
          <p
            class="text-sm font-semibold tracking-widest text-zinc-500 uppercase dark:text-zinc-400"
          >
            Our Story
          </p>
          <h1
            class="mx-auto mt-3 max-w-3xl text-4xl font-medium tracking-tight text-black md:text-5xl lg:text-6xl dark:text-white"
          >
            Where Expertise Creates Impact
          </h1>

          <div
            class="mt-10 w-full overflow-hidden rounded-2xl shadow-xl ring-1 ring-black/5 dark:ring-white/10"
          >
            <div
              class="aspect-[16/7] w-full bg-zinc-200 dark:bg-white/5"
            ></div>
          </div>

          <p
            class="mt-10 text-sm font-semibold tracking-widest text-zinc-500 uppercase dark:text-zinc-400"
          >
            About Us
          </p>
        </section>
        <!-- END About: Our Story -->

          <!-- Footer -->
          <footer
            class="flex flex-col gap-6 py-7 text-center text-sm md:col-span-12 md:flex-row-reverse md:justify-between md:gap-0 md:text-left"
          >
            <nav class="flex items-center justify-center gap-4">
              <a
                href="https://www.facebook.com/ValueConnectKe?_rdc=1&amp;_rdr"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Value Connect on Facebook"
                class="text-zinc-400 hover:text-[#1877f2]"
              >
                <svg
                  class="icon-facebook inline-block size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.378 14.192 5 15.115 5H18V0h-3.808C10.596 0 9 1.583 9 4.615V8z"
                  ></path>
                </svg>
              </a>
              <a
                href="https://x.com/ValueConnect"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Value Connect on X"
                class="text-zinc-400 hover:text-zinc-800 dark:hover:text-white"
              >
                <svg
                  class="bi bi-twitter-x inline-block size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  aria-hidden="true"
                >
                  <path
                    d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633Z"
                  />
                </svg>
              </a>
              <a
                href="https://ke.linkedin.com/company/value-connect-kenya"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Value Connect on LinkedIn"
                class="text-zinc-400 hover:text-[#0a66c2]"
              >
                <svg
                  class="icon-linkedin inline-block size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                  ></path>
                </svg>
              </a>
              <a
                href="https://www.youtube.com/channel/UC2V29xz5orKGrIPNztGX7Bw"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Value Connect on YouTube"
                class="text-zinc-400 hover:text-[#ff0000]"
              >
                <svg
                  class="icon-youtube inline-block size-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"
                  ></path>
                </svg>
              </a>
            </nav>
            <div class="text-zinc-500 dark:text-zinc-400/80">
              © 2026 Value Connect. All Rights Reserved.
            </div>
          </footer>
          <!-- END Footer -->
      </main>
      <!-- END Page Content -->
    </div>
    <!-- END Page Container -->
  </body>
</html>
