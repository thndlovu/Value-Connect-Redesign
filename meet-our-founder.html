<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Meet Our Founder - Value Connect</title>

    <meta
      name="description"
      content="Meet the founder of Value Connect."
    />

    <!-- Icons -->
    <link
      rel="icon"
      href="https://cdn.pixelcave.com/favicon.svg"
      sizes="any"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="https://cdn.pixelcave.com/favicon.png"
      type="image/png"
    />

    <!-- Inter web font from bunny.net (GDPR compliant) -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Compiled Tailwind CSS (source: src/input.css, build with: npm run build) -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Alpine.js -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <!-- Alpine.js (x-cloak - https://alpinejs.dev/directives/cloak) -->
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body class="antialiased">
    <!-- Page Container -->
    <div
      x-data="{
        darkMode: true,
        toggleDarkMode() {
          this.darkMode = ! this.darkMode;

          // Toggle dark class on html element
          if (this.darkMode) {
            document.body.parentNode.classList.add('dark');
          } else {
            document.body.parentNode.classList.remove('dark');
          }
        }
      }"
      class="min-h-dvh min-w-80 bg-page text-zinc-800 dark:bg-page-dark dark:text-zinc-100"
    >
      <!-- Page Content -->
      <main
        id="page-content"
        class="mx-auto flex max-w-6xl flex-auto flex-col px-4 pb-4 lg:px-8 lg:pb-8"
      >
        <!-- Main Header -->
        <header
          id="page-header"
          class="flex flex-none items-center justify-between py-7"
        >
          <div class="flex items-center gap-2">
            <!-- Logo -->
            <a
              href="index.html"
              class="text-2xl font-thin tracking-widest hover:text-purple-600 active:opacity-75 dark:hover:text-purple-400"
            >
              Value Connect
            </a>
            <!-- END Logo -->

            <!-- Toggle Dark Mode -->
            <button
              x-on:click="toggleDarkMode()"
              type="button"
              class="relative inline-flex size-9 items-center justify-center text-zinc-600 hover:opacity-75 dark:text-zinc-400"
            >
              <div
                x-cloak
                x-show="!darkMode"
                x-transition:enter="transition ease-out duration-150"
                x-transition:enter-start="opacity-0 rotate-180"
                x-transition:enter-end="opacity-100 rotate-0"
                x-transition:leave="transition ease-in duration-100"
                x-transition:leave-start="opacity-100 rotate-0"
                x-transition:leave-end="opacity-0 rotate-180"
                class="absolute inset-0 flex items-center justify-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="hi-outline hi-sun inline-block size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                  />
                </svg>
              </div>
              <div
                x-cloak
                x-show="darkMode"
                x-transition:enter="transition ease-out duration-150"
                x-transition:enter-start="opacity-0 rotate-180"
                x-transition:enter-end="opacity-100 rotate-0"
                x-transition:leave="transition ease-in duration-100"
                x-transition:leave-start="opacity-100 rotate-0"
                x-transition:leave-end="opacity-0 rotate-180"
                class="absolute inset-0 flex items-center justify-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="hi-outline hi-moon inline-block size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                  />
                </svg>
              </div>
            </button>
            <!-- END Toggle Dark Mode -->
          </div>
          <div class="flex items-center gap-4">
            <!-- Back link -->
            <a
              href="index.html"
              class="inline-flex items-center gap-1.5 text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="inline-block size-5"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M20.25 12a.75.75 0 0 1-.75.75H6.31l5.47 5.47a.75.75 0 1 1-1.06 1.06l-6.75-6.75a.75.75 0 0 1 0-1.06l6.75-6.75a.75.75 0 1 1 1.06 1.06l-5.47 5.47H19.5a.75.75 0 0 1 .75.75Z"
                  clip-rule="evenodd"
                />
              </svg>
              <span>Back to home</span>
            </a>
          </div>
        </header>
        <!-- END Main Header -->

        <!-- Main Content -->
        <div class="grid grid-cols-1 gap-6 md:grid-cols-12">
          <!-- Founder -->
          <div
            class="relative col-span-1 flex flex-col overflow-hidden rounded-xl bg-zinc-100 px-12 py-20 md:col-span-12 dark:bg-zinc-900"
          >
            <div
              aria-hidden="true"
              class="absolute -top-20 -left-20 size-48 rounded-full bg-purple-300 blur-2xl"
            ></div>
            <div
              aria-hidden="true"
              class="absolute -top-48 -right-48 size-96 rounded-full bg-indigo-200 blur-3xl dark:bg-indigo-400/50"
            ></div>
            <div
              aria-hidden="true"
              class="absolute inset-0 bg-purple-100/50 backdrop-blur-md dark:bg-purple-900/75"
            ></div>
            <div class="relative mx-auto mt-auto max-w-md text-center">
              <h1 class="text-4xl font-medium text-black dark:text-white">
                Meet Our Founder
              </h1>
              <h2 class="mt-3 leading-relaxed text-zinc-900 dark:text-zinc-200">
                Founder details coming soon.
              </h2>
            </div>
          </div>
          <!-- END Founder -->
        </div>
        <!-- END Main Content -->
      </main>
      <!-- END Page Content -->
    </div>
    <!-- END Page Container -->
  </body>
</html>
